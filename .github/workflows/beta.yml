name: Build Beta Release

on:
  workflow_dispatch:
    inputs:
      beta_version:
        description: 'Beta version (e.g., v1.0.0-beta.1, v1.0.0-rc.1)'
        required: true
        type: string

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri app
        run: pnpm tauri build --no-bundle --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-sanitizer-beta-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/pdf-sanitizer.exe

      - name: Create Beta Release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/${{ matrix.target }}/release/pdf-sanitizer.exe
          tag_name: ${{ github.event.inputs.beta_version }}
          draft: false
          prerelease: true
          body: |
            # Beta Release: ${{ github.event.inputs.beta_version }}

            ⚠️ **This is a beta release** - Use for testing purposes only.

            ## Download
            - Windows: `pdf-sanitizer.exe`

            ## Testing Notes
            - Please report any issues on GitHub
            - Features may change before stable release
            - Not recommended for production use
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


