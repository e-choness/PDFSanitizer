name: Build Beta Release

on:
  workflow_dispatch:
    inputs:
      beta_version:
        description: 'Beta version (e.g., v1.0.0-beta.1, v1.0.0-rc.1)'
        required: true
        type: string

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64

    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri app
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: pdf-sanitizer-beta-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/pdf-sanitizer.exe

      - name: Create Beta Release
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/${{ matrix.target }}/release/pdf-sanitizer.exe
          tag_name: ${{ github.event.inputs.beta_version }}
          draft: false
          prerelease: true
          body: |
            # Beta Release: ${{ github.event.inputs.beta_version }}

            ⚠️ **This is a beta release** - Use for testing purposes only.

            ## Download
            - Windows: `pdf-sanitizer.exe`

            ## Testing Notes
            - Please report any issues on GitHub
            - Features may change before stable release
            - Not recommended for production use
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64

    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri app
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: pdf-sanitizer-beta-macos-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/PDF*.dmg

      - name: Create Beta Release
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/PDF*.dmg
          tag_name: ${{ github.event.inputs.beta_version }}
          draft: false
          prerelease: true
          body: |
            # Beta Release: ${{ github.event.inputs.beta_version }}

            ⚠️ **This is a beta release** - Use for testing purposes only.

            ## Download
            - macOS: `PDF Sanitizer.dmg`

            ## Testing Notes
            - Please report any issues on GitHub
            - Features may change before stable release
            - Not recommended for production use
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri app
        run: cargo tauri build

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: pdf-sanitizer-beta-linux
          path: src-tauri/target/release/bundle/appimage/pdf-sanitizer*.AppImage

      - name: Create Beta Release
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/release/bundle/appimage/pdf-sanitizer*.AppImage
          tag_name: ${{ github.event.inputs.beta_version }}
          draft: false
          prerelease: true
          body: |
            # Beta Release: ${{ github.event.inputs.beta_version }}

            ⚠️ **This is a beta release** - Use for testing purposes only.

            ## Download
            - Linux: `pdf-sanitizer.AppImage`

            ## Testing Notes
            - Please report any issues on GitHub
            - Features may change before stable release
            - Not recommended for production use
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
